<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000080">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Skood Together</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>

<!-- ===================== LOBBY ===================== -->
<div id="lobby">
  <h1>Skood på YouTube</h1>
  <div id="lobbyBox">
    <h2>Create Room</h2>
    <button onclick="createRoom()">New Room</button>

    <div class="lobby-divider"></div>

    <h2>Join Room</h2>
    <input id="roomJoinInput" placeholder="Room Code" maxlength="8"
           onkeydown="if(event.key==='Enter') joinRoomFromInput()">
    <br>
    <button onclick="joinRoomFromInput()">Join Room</button>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app">

  <h1>Skood på YouTube</h1>

  <div id="roomBar">
    Room: <span id="roomCodeDisplay"></span>
    <button class="btn-icon" id="copyLinkBtn" onclick="copyRoomLink()" title="Copy Link">🔗</button>
    <button class="btn-icon" onclick="leaveRoom()" title="Leave Room" style="color:#FF6666;">✕</button>
  </div>

  <div id="userBar">
    Playing as: <span id="usernameDisplay"></span>
    <button class="btn-icon" id="renameBtn" onclick="editUsername()" title="Change Name">✎</button>
    <span id="connDot" title="Connected"></span>
  </div>

  <div id="presenceBar">In room: <span id="presenceList">just you</span></div>

  <div id="videoRow">
    <input id="videoInput" placeholder="Paste YouTube link or video ID" onkeydown="if(event.key==='Enter') loadVideo()">
    <button onclick="loadVideo()">Load Video</button>
    <button onclick="addToQueue()">+ Queue</button>
  </div>

  <div id="nowPlaying">
    <span id="nowTitle" style="vertical-align:middle;">No video loaded</span>
    <button class="btn-icon" id="starBtn" onclick="toggleFavorite()" title="Favorite" disabled>☆</button>
    <button class="btn-icon" id="replayBtn" onclick="playAgain()" title="Play again (adds to queue)" disabled>↻</button>
  </div>

  <div id="playerWrap"><div id="player"></div></div>

  <div id="panels">
    <div id="queuePanel">
      <div class="panel-header">
        <h2>Queue</h2>
        <div>
          <button class="btn-small" id="loopBtn" onclick="toggleLoop()" title="Loop current video">🔁</button>
          <button class="btn-small" onclick="skipVideo()" title="Skip to next">⏭ Skip</button>
          <button class="btn-small" onclick="clearQueue()" title="Clear Queue">Clear</button>
        </div>
      </div>
      <div id="queueList"><span class="panel-empty">Queue is empty</span></div>
    </div>
    <div id="favoritesPanel">
      <div class="panel-header">
        <h2>Favorites</h2>
      </div>
      <div id="favoritesList"><span class="panel-empty">No favorites yet, star a video!</span></div>
    </div>
  </div>

  <div class="retro-divider"></div>

  <h2>Chat</h2>
  <div id="chatBox"></div>
  <input id="chatInput" placeholder="Skriv ett meddelande" onkeydown="if(event.key==='Enter') sendMessage()">
  <button onclick="sendMessage()">Skicka</button>

</div>

<script src="script.js"></script>

</body>
</html>
