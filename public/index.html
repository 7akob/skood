<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000080">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Skåda på tv</title>
  <link rel="manifest" href="/manifest.json">
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

  <style>
body {
  background: #000080;
  font-family: "Comic Sans MS", "Tahoma", sans-serif;
  color: #00FFEA;
  text-align: center;
  padding: 20px;
}

h1 {
  color: #FFFF00;
  text-shadow: 2px 2px #FF00FF;
  font-size: clamp(24px, 7vw, 40px);
  margin-bottom: 6px;
}

h2 {
  color: #00FF00;
  text-shadow: 1px 1px black;
}

input, button {
  font-family: "Comic Sans MS", Arial;
  font-size: 16px;
  padding: 8px;
  border: 3px solid #FF00FF;
  background: linear-gradient(90deg, #00FFFF, #FF00FF);
  color: black;
  margin: 5px;
  border-radius: 5px;
  box-shadow: 2px 2px 4px black;
}

button:hover {
  background: linear-gradient(90deg, #FFFF00, #00FF00);
  cursor: pointer;
}

/* ---- Responsive player wrapper ---- */
#playerWrap {
  position: relative;
  width: 100%;
  max-width: 640px;
  margin: 10px auto 0;
  padding-bottom: min(56.25%, 360px); /* 16:9, capped at 360px on desktop */
}

#playerWrap > div, #playerWrap iframe {
  position: absolute;
  top: 0; left: 0;
  width: 100% !important;
  height: 100% !important;
}

#player {
  border: 5px double #FFFF00;
  box-shadow: 0 0 20px #FF00FF;
}

#chatBox {
  border: 4px ridge #00FFFF;
  background: rgba(0, 0, 0, 0.5);
  width: min(350px, 100%);
  height: 250px;
  margin: 0 auto;
  color: #00FFEA;
  overflow-y: auto;
  padding: 10px;
  font-size: 14px;
  box-shadow: inset 0 0 10px #00FFFF;
  box-sizing: border-box;
}

#chatInput {
  width: min(250px, 70%);
  background: #FFFFCC;
  color: black;
}

.message {
  padding: 4px;
  margin: 2px 0;
  border-bottom: 1px dotted #00FFFF;
  font-family: "Comic Sans MS", Tahoma, sans-serif;
  text-align: left;
}

.sys-message {
  padding: 3px 4px;
  margin: 2px 0;
  border-bottom: 1px dotted #333;
  font-size: 12px;
  color: #888;
  font-style: italic;
  text-align: left;
}

.retro-divider {
  margin: 20px auto;
  width: 90%;
  height: 5px;
  background: repeating-linear-gradient(
    45deg,
    #FF00FF,
    #FF00FF 10px,
    #00FFFF 10px,
    #00FFFF 20px
  );
  box-shadow: 0 0 10px #00FFFF;
}

/* ---- User bar ---- */
#userBar {
  font-size: 13px;
  color: #00FFEA;
  margin-bottom: 10px;
}

#usernameDisplay {
  color: #FFFF00;
  font-weight: bold;
}

.btn-icon {
  background: none !important;
  border: none !important;
  box-shadow: none !important;
  cursor: pointer;
  padding: 0 4px;
  margin: 0;
  vertical-align: middle;
  line-height: 1;
}

.btn-icon:hover {
  background: none !important;
}

/* ---- Connection dot ---- */
#connDot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #00FF00;
  vertical-align: middle;
  margin-left: 8px;
  box-shadow: 0 0 4px #00FF00;
  transition: background 0.3s, box-shadow 0.3s;
}

#connDot.disconnected {
  background: #FF6600;
  box-shadow: 0 0 4px #FF6600;
  animation: connBlink 1s infinite;
}

@keyframes connBlink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

/* ---- Now Playing ---- */
#nowPlaying {
  font-size: 15px;
  color: #FFFF00;
  margin: 8px 0 4px;
  min-height: 24px;
}

#starBtn {
  font-size: 22px;
  color: #FFFF00;
}

#starBtn:hover {
  color: #FF00FF;
}

#renameBtn {
  font-size: 16px;
  color: #00FFEA;
}

#renameBtn:hover {
  color: #FF00FF;
}

/* ---- Queue & Favorites panels ---- */
#panels {
  display: flex;
  gap: 15px;
  width: 100%;
  max-width: 640px;
  margin: 15px auto 0;
  text-align: left;
  box-sizing: border-box;
}

#queuePanel, #favoritesPanel {
  flex: 1;
  border: 3px ridge #00FFFF;
  background: rgba(0, 0, 0, 0.5);
  padding: 10px;
  box-shadow: 0 0 10px #00FFFF;
  min-height: 120px;
  max-height: 280px;
  overflow-y: auto;
  box-sizing: border-box;
}

#favoritesPanel {
  border-color: #FF00FF;
  box-shadow: 0 0 10px #FF00FF;
}

.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.panel-header h2 {
  margin: 0;
  font-size: 18px;
}

#favoritesPanel .panel-header h2 {
  color: #FF00FF;
}

.queue-item, .fav-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 0;
  border-bottom: 1px dotted #00FFFF;
}

.fav-item {
  border-bottom-color: #FF00FF;
}

.queue-item img, .fav-item img {
  width: 72px;
  height: 54px;
  object-fit: cover;
  border: 1px solid #00FFFF;
  flex-shrink: 0;
}

.fav-item img {
  border-color: #FF00FF;
}

.item-meta {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.item-title {
  color: #00FFEA;
  font-size: 12px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.item-by {
  font-size: 10px;
  color: #777;
  font-style: italic;
}

.btn-small {
  font-size: 11px !important;
  padding: 2px 5px !important;
  margin: 1px !important;
  border-width: 2px !important;
  flex-shrink: 0;
  white-space: nowrap;
}

.panel-empty {
  color: #555;
  font-size: 13px;
  font-style: italic;
}

/* ---- Video input row ---- */
#videoRow {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 4px;
}

#videoInput {
  flex: 1 1 200px;
  max-width: 400px;
  min-width: 0;
  box-sizing: border-box;
}

/* ---- Mobile breakpoint ---- */
@media (max-width: 660px) {
  body {
    padding: 10px;
  }

  #panels {
    flex-direction: column;
  }

  #queuePanel, #favoritesPanel {
    max-height: 220px;
  }

  #videoInput {
    width: 100%;
    max-width: 100%;
  }
}
  </style>
</head>
<body>

<h1>Skåda Youtube socket</h1>

<div id="userBar">
  Playing as: <span id="usernameDisplay"></span>
  <button class="btn-icon" id="renameBtn" onclick="editUsername()" title="Change name">✎</button>
  <span id="connDot" title="Connected"></span>
</div>

<div id="videoRow">
  <input id="videoInput" placeholder="Paste YouTube link or video ID" onkeydown="if(event.key==='Enter') loadVideo()">
  <button onclick="loadVideo()">Load Video</button>
  <button onclick="addToQueue()">+ Queue</button>
</div>

<div id="nowPlaying">
  <span id="nowTitle" style="vertical-align:middle;">No video loaded</span>
  <button class="btn-icon" id="starBtn" onclick="toggleFavorite()" title="Toggle favorite">☆</button>
</div>

<div id="playerWrap"><div id="player"></div></div>

<div id="panels">
  <div id="queuePanel">
    <div class="panel-header">
      <h2>Queue</h2>
      <div>
        <button class="btn-small" onclick="skipVideo()" title="Skip to next">⏭ Skip</button>
        <button class="btn-small" onclick="clearQueue()" title="Clear queue">Clear</button>
      </div>
    </div>
    <div id="queueList"><span class="panel-empty">Queue is empty</span></div>
  </div>
  <div id="favoritesPanel">
    <div class="panel-header">
      <h2>Favorites</h2>
    </div>
    <div id="favoritesList"><span class="panel-empty">No favorites yet — star a video!</span></div>
  </div>
</div>

<div class="retro-divider"></div>

<h2>Chat</h2>
<div id="chatBox"></div>
<input id="chatInput" placeholder="Type a message" onkeydown="if(event.key==='Enter') sendMessage()">
<button onclick="sendMessage()">Send</button>

<script>
let player;
let suppressEvents = false;
let lastState = null;
let pendingSync = null;
let currentVideoId = null;
let currentVideoTitle = null;

// Username — prompt on first visit, otherwise use stored value
let username = localStorage.getItem("yt_username");
if (!username) {
  let entered = "";
  while (!entered) {
    entered = (prompt("Welcome! What's your name?") || "").trim().slice(0, 20);
  }
  username = entered;
  localStorage.setItem("yt_username", username);
}
document.getElementById("usernameDisplay").textContent = username;

function editUsername() {
  const newName = prompt("Enter your name:", username);
  if (newName === null) return;
  const trimmed = newName.trim().slice(0, 20);
  if (!trimmed) return;
  username = trimmed;
  localStorage.setItem("yt_username", username);
  document.getElementById("usernameDisplay").textContent = username;
}


// -------------------- SERVICE WORKER (PWA) --------------------

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").catch(() => {});
}


// -------------------- SOCKET --------------------------

const socket = io({ transports: ["websocket"] });

// Connection status dot
function setConnected(connected) {
  const dot = document.getElementById("connDot");
  dot.title = connected ? "Connected" : "Reconnecting...";
  dot.classList.toggle("disconnected", !connected);
}

socket.on("disconnect", () => setConnected(false));
socket.on("connect", () => setConnected(true));

socket.on("sync_state", (s) => {
  renderQueue(s.queue || []);
  if (!player) {
    pendingSync = s;
  } else {
    applySync(s);
  }
});

socket.on("queue_update", (q) => {
  renderQueue(q);
});

socket.on("change_video", (id) => {
  suppressEvents = true;
  player.loadVideoById(id);
  player.seekTo(0, true);
  resetSuppress();
  setNowPlaying(id);
});

socket.on("play", (t) => {
  suppressEvents = true;
  player.seekTo(t, true);
  player.playVideo();
  lastState = YT.PlayerState.PLAYING;
  resetSuppress();
  if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "playing";
});

socket.on("pause", (t) => {
  suppressEvents = true;
  player.seekTo(t, true);
  player.pauseVideo();
  lastState = YT.PlayerState.PAUSED;
  resetSuppress();
  if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "paused";
});

socket.on("seek", (t) => {
  suppressEvents = true;
  player.seekTo(t, true);
  resetSuppress();
});

socket.on("system_message", (msg) => {
  appendSystemMessage(msg);
});


// -------------------- PAGE VISIBILITY --------------------

// When the tab comes back into focus, request a fresh sync in case state drifted
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && socket.connected && player) {
    socket.emit("request_sync");
  }
});


// -------------------- YOUTUBE --------------------------

function onYouTubeIframeAPIReady() {
  player = new YT.Player("player", {
    height: "100%",
    width: "100%",
    videoId: "",
    playerVars: {
      autoplay: 0,
      controls: 1,
      origin: window.location.origin,
      enablejsapi: 1,
      modestbranding: 1
    },
    events: { onStateChange }
  });

  if (pendingSync) {
    applySync(pendingSync);
    pendingSync = null;
  }
}

function applySync(s) {
  if (!player || !s.videoId) return;
  suppressEvents = true;
  player.loadVideoById(s.videoId);
  player.seekTo(s.time, true);
  if (s.isPlaying) {
    player.playVideo();
    lastState = YT.PlayerState.PLAYING;
    if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "playing";
  } else {
    player.pauseVideo();
    lastState = YT.PlayerState.PAUSED;
    if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "paused";
  }
  resetSuppress();
  setNowPlaying(s.videoId);
}

function loadVideo() {
  const input = document.getElementById("videoInput");
  const val = input.value.trim();
  if (!val) return;

  const id = extractId(val);
  socket.emit("change_video", id);

  suppressEvents = true;
  player.loadVideoById(id);
  player.seekTo(0);
  lastState = null;
  resetSuppress();
  input.value = "";

  // Fetch title then announce
  setNowPlaying(id, { announce: true });
}

async function addToQueue() {
  const input = document.getElementById("videoInput");
  const val = input.value.trim();
  if (!val) return;
  const id = extractId(val);
  const title = await fetchTitle(id);
  socket.emit("add_to_queue", { id, title, addedBy: username });
  input.value = "";
}

function removeFromQueue(index) {
  socket.emit("remove_from_queue", index);
}

function playFromQueue(index, id) {
  socket.emit("remove_from_queue", index);
  socket.emit("change_video", id);
  suppressEvents = true;
  player.loadVideoById(id);
  player.seekTo(0);
  lastState = null;
  resetSuppress();
  setNowPlaying(id, { announce: true });
}

function skipVideo() {
  socket.emit("skip_video", username);
}

function clearQueue() {
  socket.emit("clear_queue", username);
}

function extractId(str) {
  const m1 = str.match(/v=([^&]+)/);
  if (m1) return m1[1];
  const m2 = str.match(/youtu\.be\/([^?]+)/);
  if (m2) return m2[1];
  return str;
}

function onStateChange(event) {
  if (suppressEvents) return;

  const s = event.data;

  if (s === YT.PlayerState.ENDED) {
    socket.emit("video_ended", currentVideoId);
    if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "none";
    return;
  }

  if (s !== YT.PlayerState.PLAYING && s !== YT.PlayerState.PAUSED) return;
  if (s === lastState) return;
  lastState = s;

  const t = player.getCurrentTime();
  if (s === YT.PlayerState.PLAYING) {
    socket.emit("play", t);
    if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "playing";
  }
  if (s === YT.PlayerState.PAUSED) {
    socket.emit("pause", t);
    if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "paused";
  }
}

function resetSuppress() {
  setTimeout(() => suppressEvents = false, 300);
}


// -------------------- NOW PLAYING + FAVORITES --------------------------

async function setNowPlaying(id, { announce = false } = {}) {
  currentVideoId = id;
  currentVideoTitle = null;
  document.getElementById("nowTitle").textContent = "Loading...";
  updateStarBtn();
  const title = await fetchTitle(id);
  if (currentVideoId !== id) return; // video changed while fetching
  currentVideoTitle = title;
  document.getElementById("nowTitle").textContent = title;
  updateStarBtn();
  updateMediaSession(title, id);
  if (announce) {
    socket.emit("system_message", `${username} loaded "${title}"`);
  }
}

// ---- MediaSession API — OS lock screen / notification controls ----
function updateMediaSession(title, id) {
  if (!("mediaSession" in navigator)) return;

  navigator.mediaSession.metadata = new MediaMetadata({
    title: title,
    artist: "Skåda på tv",
    artwork: [
      { src: `https://img.youtube.com/vi/${id}/hqdefault.jpg`, sizes: "480x360", type: "image/jpeg" }
    ]
  });

  navigator.mediaSession.setActionHandler("play", () => {
    const t = player.getCurrentTime();
    player.playVideo();
    socket.emit("play", t);
  });

  navigator.mediaSession.setActionHandler("pause", () => {
    const t = player.getCurrentTime();
    player.pauseVideo();
    socket.emit("pause", t);
  });

  navigator.mediaSession.setActionHandler("nexttrack", () => {
    skipVideo();
  });

  // previoustrack — restart current video
  navigator.mediaSession.setActionHandler("previoustrack", () => {
    suppressEvents = true;
    player.seekTo(0, true);
    socket.emit("seek", 0);
    resetSuppress();
  });
}

async function fetchTitle(id) {
  try {
    const res = await fetch(
      `https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${id}&format=json`
    );
    if (!res.ok) return id;
    const data = await res.json();
    return data.title || id;
  } catch {
    return id;
  }
}

function getFavorites() {
  return JSON.parse(localStorage.getItem("yt_favorites") || "[]");
}

function saveFavorites(favs) {
  localStorage.setItem("yt_favorites", JSON.stringify(favs));
}

function toggleFavorite() {
  if (!currentVideoId) return;
  const favs = getFavorites();
  const idx = favs.findIndex(f => f.id === currentVideoId);
  if (idx >= 0) {
    favs.splice(idx, 1);
  } else {
    favs.unshift({ id: currentVideoId, title: currentVideoTitle || currentVideoId });
  }
  saveFavorites(favs);
  renderFavorites();
  updateStarBtn();
}

function updateStarBtn() {
  const favs = getFavorites();
  const isFav = currentVideoId && favs.some(f => f.id === currentVideoId);
  document.getElementById("starBtn").textContent = isFav ? "★" : "☆";
}

function removeFavorite(index) {
  const favs = getFavorites();
  favs.splice(index, 1);
  saveFavorites(favs);
  renderFavorites();
  updateStarBtn();
}

function loadFavorite(id) {
  socket.emit("change_video", id);
  suppressEvents = true;
  player.loadVideoById(id);
  player.seekTo(0);
  lastState = null;
  resetSuppress();
  setNowPlaying(id, { announce: true });
}

function queueFavorite(id, title) {
  socket.emit("add_to_queue", { id, title, addedBy: username });
}

function renderQueue(q) {
  const list = document.getElementById("queueList");
  if (q.length === 0) {
    list.innerHTML = '<span class="panel-empty">Queue is empty</span>';
    return;
  }
  list.innerHTML = "";
  q.forEach((item, i) => {
    const div = document.createElement("div");
    div.className = "queue-item";

    const thumb = document.createElement("img");
    thumb.src = `https://img.youtube.com/vi/${item.id}/default.jpg`;
    thumb.alt = "";

    const meta = document.createElement("div");
    meta.className = "item-meta";

    const titleEl = document.createElement("span");
    titleEl.className = "item-title";
    titleEl.textContent = item.title;
    titleEl.title = item.title;

    const byEl = document.createElement("span");
    byEl.className = "item-by";
    byEl.textContent = "added by " + item.addedBy;

    meta.append(titleEl, byEl);

    const btnPlay = document.createElement("button");
    btnPlay.className = "btn-small";
    btnPlay.textContent = "▶";
    btnPlay.title = "Play now";
    btnPlay.onclick = () => playFromQueue(i, item.id);

    const btnRemove = document.createElement("button");
    btnRemove.className = "btn-small";
    btnRemove.textContent = "✕";
    btnRemove.title = "Remove";
    btnRemove.onclick = () => removeFromQueue(i);

    div.append(thumb, meta, btnPlay, btnRemove);
    list.appendChild(div);
  });
}

function renderFavorites() {
  const favs = getFavorites();
  const list = document.getElementById("favoritesList");
  if (favs.length === 0) {
    list.innerHTML = '<span class="panel-empty">No favorites yet — star a video!</span>';
    return;
  }
  list.innerHTML = "";
  favs.forEach((fav, i) => {
    const div = document.createElement("div");
    div.className = "fav-item";

    const thumb = document.createElement("img");
    thumb.src = `https://img.youtube.com/vi/${fav.id}/default.jpg`;
    thumb.alt = "";

    const meta = document.createElement("div");
    meta.className = "item-meta";

    const titleEl = document.createElement("span");
    titleEl.className = "item-title";
    titleEl.textContent = fav.title;
    titleEl.title = fav.title;

    meta.append(titleEl);

    const btnLoad = document.createElement("button");
    btnLoad.className = "btn-small";
    btnLoad.textContent = "▶";
    btnLoad.title = "Play now";
    btnLoad.onclick = () => loadFavorite(fav.id);

    const btnQueue = document.createElement("button");
    btnQueue.className = "btn-small";
    btnQueue.textContent = "+Q";
    btnQueue.title = "Add to queue";
    btnQueue.onclick = () => queueFavorite(fav.id, fav.title);

    const btnRemove = document.createElement("button");
    btnRemove.className = "btn-small";
    btnRemove.textContent = "✕";
    btnRemove.title = "Remove from favorites";
    btnRemove.onclick = () => removeFavorite(i);

    div.append(thumb, meta, btnLoad, btnQueue, btnRemove);
    list.appendChild(div);
  });
}

// Render favorites from localStorage on load
renderFavorites();


// ------------------- CHAT ---------------------

function sendMessage() {
  const input = document.getElementById("chatInput");
  const msg = input.value.trim();
  if (!msg) return;
  socket.emit("chat_message", { user: username, text: msg });
  input.value = "";
}

socket.on("chat_message", (data) => {
  const { user, text } = data;
  const box = document.getElementById("chatBox");
  const time = new Date().toLocaleTimeString();

  const el = document.createElement("div");
  el.className = "message";

  const safeText = escHtml(text);
  const safeUser = escHtml(user);

  if (user === username) {
    el.innerHTML = `
      <span style="color:#FFFF00;">[${time}]</span>
      <span style="color:#00FF00;"><b>You:</b></span>
      <span style="color:#FFFFFF;">${safeText}</span>
    `;
  } else {
    el.innerHTML = `
      <span style="color:#FFFF00;">[${time}]</span>
      <span style="color:#00FFEA;"><b>${safeUser}:</b></span>
      <span style="color:#FFFFFF;">${safeText}</span>
    `;
  }

  box.appendChild(el);
  box.scrollTop = box.scrollHeight;
});

function appendSystemMessage(msg) {
  const box = document.getElementById("chatBox");
  const el = document.createElement("div");
  el.className = "sys-message";
  el.textContent = "⚡ " + msg;
  box.appendChild(el);
  box.scrollTop = box.scrollHeight;
}

function escHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
</script>

</body>
</html>
