<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000080">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Skåda på tv</title>
  <link rel="manifest" href="/manifest.json">
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

  <style>
* { box-sizing: border-box; }

body {
  background: #000080;
  font-family: "Comic Sans MS", "Tahoma", sans-serif;
  color: #00FFEA;
  text-align: center;
  padding: 20px;
  margin: 0;
}

h1 {
  color: #FFFF00;
  text-shadow: 2px 2px #FF00FF;
  font-size: clamp(24px, 7vw, 40px);
  margin-bottom: 6px;
}

h2 {
  color: #00FF00;
  text-shadow: 1px 1px black;
}

input, button {
  font-family: "Comic Sans MS", Arial;
  font-size: 16px;
  padding: 8px;
  border: 3px solid #FF00FF;
  background: linear-gradient(90deg, #00FFFF, #FF00FF);
  color: black;
  margin: 5px;
  border-radius: 5px;
  box-shadow: 2px 2px 4px black;
}

button:hover {
  background: linear-gradient(90deg, #FFFF00, #00FF00);
  cursor: pointer;
}

.retro-divider {
  margin: 20px auto;
  width: 90%;
  height: 5px;
  background: repeating-linear-gradient(
    45deg,
    #FF00FF, #FF00FF 10px,
    #00FFFF 10px, #00FFFF 20px
  );
  box-shadow: 0 0 10px #00FFFF;
}

/* ===================== LOBBY ===================== */
#lobby {
  max-width: 400px;
  margin: 40px auto;
}

#lobbyBox {
  border: 4px ridge #00FFFF;
  background: rgba(0,0,0,0.5);
  padding: 24px 20px;
  box-shadow: 0 0 20px #00FFFF;
}

#lobbyBox h2 {
  margin: 0 0 12px;
  font-size: 20px;
}

.lobby-divider {
  margin: 18px auto;
  width: 80%;
  height: 3px;
  background: repeating-linear-gradient(
    45deg,
    #FF00FF, #FF00FF 8px,
    #00FFFF 8px, #00FFFF 16px
  );
}

#roomJoinInput {
  width: min(200px, 100%);
  background: #FFFFCC;
  color: black;
  text-transform: uppercase;
  letter-spacing: 2px;
  font-size: 18px;
  text-align: center;
}

/* ===================== APP ===================== */
#app { display: none; }

/* ---- Room bar ---- */
#roomBar {
  font-size: 13px;
  color: #00FFEA;
  margin-bottom: 6px;
}

#roomCodeDisplay {
  color: #FFFF00;
  font-weight: bold;
  letter-spacing: 2px;
  font-size: 15px;
}

/* ---- User bar ---- */
#userBar {
  font-size: 13px;
  color: #00FFEA;
  margin-bottom: 10px;
}

#usernameDisplay {
  color: #FFFF00;
  font-weight: bold;
}

.btn-icon {
  background: none !important;
  border: none !important;
  box-shadow: none !important;
  cursor: pointer;
  padding: 0 4px;
  margin: 0;
  vertical-align: middle;
  line-height: 1;
}
.btn-icon:hover { background: none !important; }

/* ---- Connection dot ---- */
#connDot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #00FF00;
  vertical-align: middle;
  margin-left: 8px;
  box-shadow: 0 0 4px #00FF00;
  transition: background 0.3s, box-shadow 0.3s;
}
#connDot.disconnected {
  background: #FF6600;
  box-shadow: 0 0 4px #FF6600;
  animation: connBlink 1s infinite;
}
@keyframes connBlink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

/* ---- Video input row ---- */
#videoRow {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 4px;
}

#videoInput {
  flex: 1 1 200px;
  max-width: 400px;
  min-width: 0;
  background: #FFFFCC;
  color: black;
}

/* ---- Now Playing ---- */
#nowPlaying {
  font-size: 15px;
  color: #FFFF00;
  margin: 8px 0 4px;
  min-height: 24px;
}

#starBtn { font-size: 22px; color: #FFFF00; }
#starBtn:hover { color: #FF00FF; }
#renameBtn { font-size: 16px; color: #00FFEA; }
#renameBtn:hover { color: #FF00FF; }

/* ---- Responsive player wrapper ---- */
#playerWrap {
  position: relative;
  width: 100%;
  max-width: 640px;
  margin: 10px auto 0;
  padding-bottom: min(56.25%, 360px);
}
#playerWrap > div, #playerWrap iframe {
  position: absolute;
  top: 0; left: 0;
  width: 100% !important;
  height: 100% !important;
}
#player {
  border: 5px double #FFFF00;
  box-shadow: 0 0 20px #FF00FF;
}

/* ---- Queue & Favorites panels ---- */
#panels {
  display: flex;
  gap: 15px;
  width: 100%;
  max-width: 640px;
  margin: 15px auto 0;
  text-align: left;
}

#queuePanel, #favoritesPanel {
  flex: 1;
  border: 3px ridge #00FFFF;
  background: rgba(0,0,0,0.5);
  padding: 10px;
  box-shadow: 0 0 10px #00FFFF;
  min-height: 120px;
  max-height: 280px;
  overflow-y: auto;
}
#favoritesPanel {
  border-color: #FF00FF;
  box-shadow: 0 0 10px #FF00FF;
}

.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.panel-header h2 { margin: 0; font-size: 18px; }
#favoritesPanel .panel-header h2 { color: #FF00FF; }

.queue-item, .fav-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 0;
  border-bottom: 1px dotted #00FFFF;
}
.fav-item { border-bottom-color: #FF00FF; }

.queue-item img, .fav-item img {
  width: 72px;
  height: 54px;
  object-fit: cover;
  border: 1px solid #00FFFF;
  flex-shrink: 0;
}
.fav-item img { border-color: #FF00FF; }

.item-meta {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.item-title {
  color: #00FFEA;
  font-size: 12px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.item-by { font-size: 10px; color: #777; font-style: italic; }

.btn-small {
  font-size: 11px !important;
  padding: 2px 5px !important;
  margin: 1px !important;
  border-width: 2px !important;
  flex-shrink: 0;
  white-space: nowrap;
}
.panel-empty { color: #555; font-size: 13px; font-style: italic; }

/* ---- Chat ---- */
#chatBox {
  border: 4px ridge #00FFFF;
  background: rgba(0,0,0,0.5);
  width: min(350px, 100%);
  height: 250px;
  margin: 0 auto;
  color: #00FFEA;
  overflow-y: auto;
  padding: 10px;
  font-size: 14px;
  box-shadow: inset 0 0 10px #00FFFF;
}
#chatInput {
  width: min(250px, 70%);
  background: #FFFFCC;
  color: black;
}

.message {
  padding: 4px;
  margin: 2px 0;
  border-bottom: 1px dotted #00FFFF;
  font-family: "Comic Sans MS", Tahoma, sans-serif;
  text-align: left;
}
.sys-message {
  padding: 3px 4px;
  margin: 2px 0;
  border-bottom: 1px dotted #333;
  font-size: 12px;
  color: #888;
  font-style: italic;
  text-align: left;
}

/* ---- Mobile ---- */
@media (max-width: 660px) {
  body { padding: 10px; }
  #panels { flex-direction: column; }
  #queuePanel, #favoritesPanel { max-height: 220px; }
  #videoInput { width: 100%; max-width: 100%; }
}
  </style>
</head>
<body>

<!-- ===================== LOBBY ===================== -->
<div id="lobby">
  <h1>Skåda på tv</h1>
  <div id="lobbyBox">
    <h2>Skapa rum</h2>
    <button onclick="createRoom()">✨ Nytt rum</button>

    <div class="lobby-divider"></div>

    <h2>Gå med i rum</h2>
    <input id="roomJoinInput" placeholder="Rumskod" maxlength="8"
           onkeydown="if(event.key==='Enter') joinRoomFromInput()">
    <br>
    <button onclick="joinRoomFromInput()">Gå med →</button>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app">

  <h1>Skåda på tv</h1>

  <div id="roomBar">
    Rum: <span id="roomCodeDisplay"></span>
    <button class="btn-icon" onclick="copyRoomLink()" title="Kopiera länk">🔗</button>
    <button class="btn-icon" onclick="leaveRoom()" title="Lämna rum" style="color:#FF6666;">✕</button>
  </div>

  <div id="userBar">
    Spelar som: <span id="usernameDisplay"></span>
    <button class="btn-icon" id="renameBtn" onclick="editUsername()" title="Byt namn">✎</button>
    <span id="connDot" title="Ansluten"></span>
  </div>

  <div id="videoRow">
    <input id="videoInput" placeholder="Klistra in YouTube-länk eller video-ID" onkeydown="if(event.key==='Enter') loadVideo()">
    <button onclick="loadVideo()">Ladda video</button>
    <button onclick="addToQueue()">+ Kö</button>
  </div>

  <div id="nowPlaying">
    <span id="nowTitle" style="vertical-align:middle;">Ingen video laddad</span>
    <button class="btn-icon" id="starBtn" onclick="toggleFavorite()" title="Favoritmarkera">☆</button>
  </div>

  <div id="playerWrap"><div id="player"></div></div>

  <div id="panels">
    <div id="queuePanel">
      <div class="panel-header">
        <h2>Kö</h2>
        <div>
          <button class="btn-small" onclick="skipVideo()" title="Hoppa till nästa">⏭ Hoppa</button>
          <button class="btn-small" onclick="clearQueue()" title="Rensa kö">Rensa</button>
        </div>
      </div>
      <div id="queueList"><span class="panel-empty">Kön är tom</span></div>
    </div>
    <div id="favoritesPanel">
      <div class="panel-header">
        <h2>Favoriter</h2>
      </div>
      <div id="favoritesList"><span class="panel-empty">Inga favoriter än — stjärnmärk en video!</span></div>
    </div>
  </div>

  <div class="retro-divider"></div>

  <h2>Chatt</h2>
  <div id="chatBox"></div>
  <input id="chatInput" placeholder="Skriv ett meddelande" onkeydown="if(event.key==='Enter') sendMessage()">
  <button onclick="sendMessage()">Skicka</button>

</div><!-- #app -->

<script>
// -------------------- SERVICE WORKER --------------------
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").catch(() => {});
}

// -------------------- STATE --------------------
let player;
let suppressEvents = false;
let lastState = null;
let pendingSync = null;
let currentVideoId = null;
let currentVideoTitle = null;
let currentRoomId = null;

// -------------------- USERNAME --------------------
let username = localStorage.getItem("yt_username");
if (!username) {
  let entered = "";
  while (!entered) {
    entered = (prompt("Välkommen! Vad heter du?") || "").trim().slice(0, 20);
  }
  username = entered;
  localStorage.setItem("yt_username", username);
}

function editUsername() {
  const newName = prompt("Ange ditt namn:", username);
  if (newName === null) return;
  const trimmed = newName.trim().slice(0, 20);
  if (!trimmed) return;
  username = trimmed;
  localStorage.setItem("yt_username", username);
  document.getElementById("usernameDisplay").textContent = username;
}

// -------------------- ROOM LOBBY --------------------
function generateRoomId() {
  return Math.random().toString(36).slice(2, 8).toUpperCase();
}

function createRoom() {
  enterRoom(generateRoomId());
}

function joinRoomFromInput() {
  const val = document.getElementById("roomJoinInput").value.trim().toUpperCase();
  if (!val) return;
  enterRoom(val);
}

function enterRoom(roomId) {
  currentRoomId = roomId;
  history.replaceState({}, "", "?room=" + roomId);
  document.getElementById("roomCodeDisplay").textContent = roomId;
  document.getElementById("usernameDisplay").textContent = username;
  document.getElementById("lobby").style.display = "none";
  document.getElementById("app").style.display = "block";
  renderFavorites();
  if (socket.connected) {
    socket.emit("join_room", currentRoomId);
  }
}

function leaveRoom() {
  history.replaceState({}, "", "/");
  currentRoomId = null;
  pendingSync = null;
  currentVideoId = null;
  currentVideoTitle = null;
  document.getElementById("app").style.display = "none";
  document.getElementById("lobby").style.display = "block";
  document.getElementById("roomJoinInput").value = "";
}

function copyRoomLink() {
  const url = location.origin + "?room=" + currentRoomId;
  navigator.clipboard.writeText(url).then(() => {
    appendSystemMessage("Länk kopierad: " + url);
  }).catch(() => {
    prompt("Kopiera länken:", url);
  });
}

// Check URL on load — skip lobby if room param present
(function () {
  const params = new URLSearchParams(location.search);
  const room = params.get("room");
  if (room) enterRoom(room.toUpperCase());
})();

// -------------------- SOCKET --------------------
const socket = io({ transports: ["websocket"] });

function setConnected(connected) {
  const dot = document.getElementById("connDot");
  dot.title = connected ? "Ansluten" : "Återansluter...";
  dot.classList.toggle("disconnected", !connected);
}

socket.on("disconnect", () => setConnected(false));

socket.on("connect", () => {
  setConnected(true);
  // Re-join room on every connect/reconnect — server sends fresh sync_state in response
  if (currentRoomId) socket.emit("join_room", currentRoomId);
});

socket.on("sync_state", (s) => {
  renderQueue(s.queue || []);
  if (!player) {
    pendingSync = s;
  } else {
    applySync(s);
  }
});

socket.on("queue_update", (q) => renderQueue(q));

socket.on("change_video", (id) => {
  suppressEvents = true;
  player.loadVideoById(id);
  player.seekTo(0, true);
  resetSuppress();
  setNowPlaying(id);
});

socket.on("play", (t) => {
  suppressEvents = true;
  player.seekTo(t, true);
  player.playVideo();
  lastState = YT.PlayerState.PLAYING;
  resetSuppress();
  if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "playing";
});

socket.on("pause", (t) => {
  suppressEvents = true;
  player.seekTo(t, true);
  player.pauseVideo();
  lastState = YT.PlayerState.PAUSED;
  resetSuppress();
  if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "paused";
});

socket.on("seek", (t) => {
  suppressEvents = true;
  player.seekTo(t, true);
  resetSuppress();
});

socket.on("system_message", (msg) => appendSystemMessage(msg));
socket.on("chat_message", (data) => renderChatMessage(data));

// -------------------- PAGE VISIBILITY --------------------
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && socket.connected && currentRoomId) {
    socket.emit("request_sync");
  }
});

// -------------------- YOUTUBE --------------------
function onYouTubeIframeAPIReady() {
  player = new YT.Player("player", {
    height: "100%",
    width: "100%",
    videoId: "",
    playerVars: {
      autoplay: 0,
      controls: 1,
      origin: window.location.origin,
      enablejsapi: 1,
      modestbranding: 1
    },
    events: { onStateChange }
  });

  if (pendingSync) {
    applySync(pendingSync);
    pendingSync = null;
  }
}

function applySync(s) {
  if (!player || !s.videoId) return;
  suppressEvents = true;
  player.loadVideoById(s.videoId);
  player.seekTo(s.time, true);
  if (s.isPlaying) {
    player.playVideo();
    lastState = YT.PlayerState.PLAYING;
    if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "playing";
  } else {
    player.pauseVideo();
    lastState = YT.PlayerState.PAUSED;
    if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "paused";
  }
  resetSuppress();
  setNowPlaying(s.videoId);
}

function loadVideo() {
  const input = document.getElementById("videoInput");
  const val = input.value.trim();
  if (!val) return;
  const id = extractId(val);
  socket.emit("change_video", id);
  suppressEvents = true;
  player.loadVideoById(id);
  player.seekTo(0);
  lastState = null;
  resetSuppress();
  input.value = "";
  setNowPlaying(id, { announce: true });
}

async function addToQueue() {
  const input = document.getElementById("videoInput");
  const val = input.value.trim();
  if (!val) return;
  const id = extractId(val);
  const title = await fetchTitle(id);
  socket.emit("add_to_queue", { id, title, addedBy: username });
  input.value = "";
}

function removeFromQueue(index) { socket.emit("remove_from_queue", index); }

function playFromQueue(index, id) {
  socket.emit("remove_from_queue", index);
  socket.emit("change_video", id);
  suppressEvents = true;
  player.loadVideoById(id);
  player.seekTo(0);
  lastState = null;
  resetSuppress();
  setNowPlaying(id, { announce: true });
}

function skipVideo() { socket.emit("skip_video", username); }
function clearQueue() { socket.emit("clear_queue", username); }

function extractId(str) {
  const m1 = str.match(/v=([^&]+)/);
  if (m1) return m1[1];
  const m2 = str.match(/youtu\.be\/([^?]+)/);
  if (m2) return m2[1];
  return str;
}

function onStateChange(event) {
  if (suppressEvents) return;
  const s = event.data;

  if (s === YT.PlayerState.ENDED) {
    socket.emit("video_ended", currentVideoId);
    if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "none";
    return;
  }

  if (s !== YT.PlayerState.PLAYING && s !== YT.PlayerState.PAUSED) return;
  if (s === lastState) return;
  lastState = s;

  const t = player.getCurrentTime();
  if (s === YT.PlayerState.PLAYING) {
    socket.emit("play", t);
    if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "playing";
  }
  if (s === YT.PlayerState.PAUSED) {
    socket.emit("pause", t);
    if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "paused";
  }
}

function resetSuppress() { setTimeout(() => suppressEvents = false, 300); }

// -------------------- NOW PLAYING + FAVORITES --------------------
async function setNowPlaying(id, { announce = false } = {}) {
  currentVideoId = id;
  currentVideoTitle = null;
  document.getElementById("nowTitle").textContent = "Laddar...";
  updateStarBtn();
  const title = await fetchTitle(id);
  if (currentVideoId !== id) return;
  currentVideoTitle = title;
  document.getElementById("nowTitle").textContent = title;
  updateStarBtn();
  updateMediaSession(title, id);
  if (announce) socket.emit("system_message", `${username} laddade "${title}"`);
}

function updateMediaSession(title, id) {
  if (!("mediaSession" in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: title,
    artist: "Skåda på tv",
    artwork: [{ src: `https://img.youtube.com/vi/${id}/hqdefault.jpg`, sizes: "480x360", type: "image/jpeg" }]
  });
  navigator.mediaSession.setActionHandler("play", () => {
    const t = player.getCurrentTime();
    player.playVideo();
    socket.emit("play", t);
  });
  navigator.mediaSession.setActionHandler("pause", () => {
    const t = player.getCurrentTime();
    player.pauseVideo();
    socket.emit("pause", t);
  });
  navigator.mediaSession.setActionHandler("nexttrack", () => skipVideo());
  navigator.mediaSession.setActionHandler("previoustrack", () => {
    suppressEvents = true;
    player.seekTo(0, true);
    socket.emit("seek", 0);
    resetSuppress();
  });
}

async function fetchTitle(id) {
  try {
    const res = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${id}&format=json`);
    if (!res.ok) return id;
    const data = await res.json();
    return data.title || id;
  } catch { return id; }
}

function getFavorites() { return JSON.parse(localStorage.getItem("yt_favorites") || "[]"); }
function saveFavorites(favs) { localStorage.setItem("yt_favorites", JSON.stringify(favs)); }

function toggleFavorite() {
  if (!currentVideoId) return;
  const favs = getFavorites();
  const idx = favs.findIndex(f => f.id === currentVideoId);
  if (idx >= 0) favs.splice(idx, 1);
  else favs.unshift({ id: currentVideoId, title: currentVideoTitle || currentVideoId });
  saveFavorites(favs);
  renderFavorites();
  updateStarBtn();
}

function updateStarBtn() {
  const isFav = currentVideoId && getFavorites().some(f => f.id === currentVideoId);
  document.getElementById("starBtn").textContent = isFav ? "★" : "☆";
}

function removeFavorite(index) {
  const favs = getFavorites();
  favs.splice(index, 1);
  saveFavorites(favs);
  renderFavorites();
  updateStarBtn();
}

function loadFavorite(id) {
  socket.emit("change_video", id);
  suppressEvents = true;
  player.loadVideoById(id);
  player.seekTo(0);
  lastState = null;
  resetSuppress();
  setNowPlaying(id, { announce: true });
}

function queueFavorite(id, title) {
  socket.emit("add_to_queue", { id, title, addedBy: username });
}

function renderQueue(q) {
  const list = document.getElementById("queueList");
  if (q.length === 0) {
    list.innerHTML = '<span class="panel-empty">Kön är tom</span>';
    return;
  }
  list.innerHTML = "";
  q.forEach((item, i) => {
    const div = document.createElement("div");
    div.className = "queue-item";

    const thumb = document.createElement("img");
    thumb.src = `https://img.youtube.com/vi/${item.id}/default.jpg`;
    thumb.alt = "";

    const meta = document.createElement("div");
    meta.className = "item-meta";

    const titleEl = document.createElement("span");
    titleEl.className = "item-title";
    titleEl.textContent = item.title;
    titleEl.title = item.title;

    const byEl = document.createElement("span");
    byEl.className = "item-by";
    byEl.textContent = "tillagd av " + item.addedBy;

    meta.append(titleEl, byEl);

    const btnPlay = document.createElement("button");
    btnPlay.className = "btn-small";
    btnPlay.textContent = "▶";
    btnPlay.title = "Spela nu";
    btnPlay.onclick = () => playFromQueue(i, item.id);

    const btnRemove = document.createElement("button");
    btnRemove.className = "btn-small";
    btnRemove.textContent = "✕";
    btnRemove.title = "Ta bort";
    btnRemove.onclick = () => removeFromQueue(i);

    div.append(thumb, meta, btnPlay, btnRemove);
    list.appendChild(div);
  });
}

function renderFavorites() {
  const favs = getFavorites();
  const list = document.getElementById("favoritesList");
  if (favs.length === 0) {
    list.innerHTML = '<span class="panel-empty">Inga favoriter än — stjärnmärk en video!</span>';
    return;
  }
  list.innerHTML = "";
  favs.forEach((fav, i) => {
    const div = document.createElement("div");
    div.className = "fav-item";

    const thumb = document.createElement("img");
    thumb.src = `https://img.youtube.com/vi/${fav.id}/default.jpg`;
    thumb.alt = "";

    const meta = document.createElement("div");
    meta.className = "item-meta";

    const titleEl = document.createElement("span");
    titleEl.className = "item-title";
    titleEl.textContent = fav.title;
    titleEl.title = fav.title;

    meta.append(titleEl);

    const btnLoad = document.createElement("button");
    btnLoad.className = "btn-small";
    btnLoad.textContent = "▶";
    btnLoad.title = "Spela nu";
    btnLoad.onclick = () => loadFavorite(fav.id);

    const btnQueue = document.createElement("button");
    btnQueue.className = "btn-small";
    btnQueue.textContent = "+Kö";
    btnQueue.title = "Lägg till i kö";
    btnQueue.onclick = () => queueFavorite(fav.id, fav.title);

    const btnRemove = document.createElement("button");
    btnRemove.className = "btn-small";
    btnRemove.textContent = "✕";
    btnRemove.title = "Ta bort från favoriter";
    btnRemove.onclick = () => removeFavorite(i);

    div.append(thumb, meta, btnLoad, btnQueue, btnRemove);
    list.appendChild(div);
  });
}

// -------------------- CHAT --------------------
function sendMessage() {
  const input = document.getElementById("chatInput");
  const msg = input.value.trim();
  if (!msg) return;
  socket.emit("chat_message", { user: username, text: msg });
  input.value = "";
}

function renderChatMessage(data) {
  const { user, text } = data;
  const box = document.getElementById("chatBox");
  const time = new Date().toLocaleTimeString();
  const el = document.createElement("div");
  el.className = "message";
  const safeText = escHtml(text);
  const safeUser = escHtml(user);
  if (user === username) {
    el.innerHTML = `<span style="color:#FFFF00;">[${time}]</span> <span style="color:#00FF00;"><b>Du:</b></span> <span style="color:#FFFFFF;">${safeText}</span>`;
  } else {
    el.innerHTML = `<span style="color:#FFFF00;">[${time}]</span> <span style="color:#00FFEA;"><b>${safeUser}:</b></span> <span style="color:#FFFFFF;">${safeText}</span>`;
  }
  box.appendChild(el);
  box.scrollTop = box.scrollHeight;
}

function appendSystemMessage(msg) {
  const box = document.getElementById("chatBox");
  const el = document.createElement("div");
  el.className = "sys-message";
  el.textContent = "⚡ " + msg;
  box.appendChild(el);
  box.scrollTop = box.scrollHeight;
}

function escHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
